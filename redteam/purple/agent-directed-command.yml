title: Agent-directed command
description: An instruction that agents must run a fetch command, or a line-start Assistant/AI/Agent role label followed by an order to run, call, use, execute or fetch.
level: high
logsource:
    product: claude-proxy
    category: prompt
detection:
    selection:
        text|re:
            - '[Aa]gents (?:must|should|need to) (?:run|execute|call|fetch)[^\n]{0,9}(?:curl|wget|WebFetch|http)'
            - '(?:^|\n)[ \t]{0,8}(?:Assistant|AI|Agent): (?:also |then |now |first |)(?:run|call|use|execute|fetch) '
    condition: selection

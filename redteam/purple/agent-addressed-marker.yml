title: Agent-addressed marker
description: Tool output that addresses its reader as an AI agent or assistant (a label or bracketed note aimed at the model, not the user).
level: high
logsource:
    product: claude-proxy
    category: prompt
detection:
    selection:
        text|contains:
            - 'AI agents:'
            - 'AI agent:'
            - 'AI assistants:'
            - 'AI assistant:'
            - '[for AI '
            - '[for agents]'
            - 'for agents)'
    condition: selection

title: Agent-addressed marker
description: A label or bracketed note aimed at an AI agent or assistant that goes on to name a fetch tool (WebFetch, curl, wget), or an agents-only label followed by an encoded payload.
level: high
logsource:
    product: claude-proxy
    category: prompt
detection:
    selection:
        text|re:
            - '(?:AI (?:[Aa]gents|[Aa]gent|[Aa]ssistants|[Aa]ssistant):|\[for (?:AI tools|AI agents|AI assistants|AI|agents)\])[^\n]{0,60}(?:WebFetch|curl|wget)'
            - 'for agents\): [A-Za-z0-9+/]{16}'
    condition: selection

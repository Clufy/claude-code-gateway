title: Tool-channel directive
description: An order to run curl or wget on a URL through the agent's own shell tool ("in the shell", "via Bash"), not a how-to for the reader's own shell.
level: high
logsource:
    product: claude-proxy
    category: prompt
detection:
    selection:
        text|re:
            - '[Rr]un (?:curl|wget) (?:http|https)://\S{1,80} (?:in the shell|via Bash|with Bash|with the Bash tool)'
    condition: selection
